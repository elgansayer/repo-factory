name: CI

# Canonical gate for repo-factory. The host updater deploys only a main commit
# whose push (or workflow_dispatch) run of this workflow succeeded.
# Actions stays disabled on this private repository until the included-minutes
# entitlement check passes (elgansayer/elgl#9822, receipt 8).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: automation/uv.lock
      - name: Install frozen Factory dependencies
        run: uv sync --frozen --extra development
        working-directory: automation
      - run: uv run --frozen ruff format --check .
        working-directory: automation
      - run: uv run --frozen ruff check openhands_factory tests runtime_checks
        working-directory: automation
      - run: uv run --frozen mypy openhands_factory
        working-directory: automation
      - name: Enable unprivileged namespaces for containment integration
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: uv run --frozen pytest
        working-directory: automation
      - name: Require actual provider and preparation namespace containment
        env:
          NEPTUNE_ACCEPTED_SOURCE: ''
          NEPTUNE_INTAKE_EVIDENCE: ${{ runner.temp }}/neptune-intake-evidence
        run: uv run --frozen pytest runtime_checks/test_process_guard_namespace.py runtime_checks/test_supervised_routing_namespace.py runtime_checks/test_preparation_namespace.py runtime_checks/test_neptune_intake_namespace.py
        working-directory: automation

      - name: Preserve accepted-intake fixture evidence including divergence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neptune-intake-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/neptune-intake-evidence
          if-no-files-found: error
