# Factory LiteLLM exact-match cache. Loopback only, memory-bounded, no persistence needed.
services:
  litellm-redis:
    image: redis:7-alpine
    container_name: factory-litellm-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
